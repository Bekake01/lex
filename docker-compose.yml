services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex
      POSTGRES_DB: lex
    ports:
      - '5434:5432'
    volumes:
      - lex-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lex -d lex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: lex-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6391:6379'
    volumes:
      - lex-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lex-postgres-data:
  lex-redis-data:
