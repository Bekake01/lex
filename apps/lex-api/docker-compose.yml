services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex
      POSTGRES_DB: lex
    ports:
      - '5433:5432'
    volumes:
      - lex-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lex -d lex']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lex-db:
