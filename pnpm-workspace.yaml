packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  # Optional native speed-up for BullMQ's msgpack; the JS fallback is fine.
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

catalog:
  typescript: ^6.0.2
  '@types/node': ^24.0.0

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@1.12.0'
